[project]
name = "wh40k-dow-de-tc-mod"
version = "1.0.0"
description = "Unofficial Traditional Chinese patch for WH40K: Dawn of War – Definitive Edition"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# SGA archive tools — needed only for repacking (optional; most workflows use the
# unpacked data/ folder directly and skip SGA repacking entirely).
sga = [
  "relic-tool-sga",
  "relic-tool-sga-v2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
# Keep the project venv in .venv so scripts can reference it by convention.
# The separate .venv-relic is only needed for relic SGA tooling (Windows-only
# binary; install via `make setup-sga` when on Windows / Wine).
